name: Build RideMitra APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Prepare and Patch Android App
        run: |
          # 1. Workspace create karo
          mkdir -p workspace
          cd workspace
          flutter create . --project-name ridemitra --overwrite

          # 2. Files replace karo
          cd ..
          cp main.dart workspace/lib/main.dart
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml workspace/pubspec.yaml; fi

          cd workspace

          # 3. Android Manifest me Location aur Internet Permissions Inject karo
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              content = manifest_path.read_text()
              permissions = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              '''
              if "ACCESS_FINE_LOCATION" not in content:
                  content = content.replace('<manifest', '<manifest\n' + permissions, 1)
                  manifest_path.write_text(content)
          PY

          # 4. APK Build karo
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 5. Output prepare karo
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMitra-APK
          path: output/app-release.apk
