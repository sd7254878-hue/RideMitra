name: Build RideMitra APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create and Build Project
        run: |
          flutter create app_temp --project-name ridemitra --org com.ridemitra.app
          cd app_temp
          cp ../main.dart lib/main.dart
          flutter pub add geolocator cupertino_icons
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMitra-APK
          path: output/app-release.apk
