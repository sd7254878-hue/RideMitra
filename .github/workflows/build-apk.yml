name: Build RideMitra APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build Flutter APK Direct
        run: |
          # Safe temporary workspace create karo
          mkdir -p /tmp/app_build/lib
          
          # Root se exact main.dart aur pubspec.yaml copy karo
          cp main.dart /tmp/app_build/lib/main.dart
          cp pubspec.yaml /tmp/app_build/pubspec.yaml

          # Skeleton Android generation inside temp folder
          cd /tmp/app_build
          flutter create . --project-name ridemitra --overwrite

          # Template code ko dubara aapke original main.dart se replace karo
          cp /github/workspace/main.dart lib/main.dart
          cp /github/workspace/pubspec.yaml pubspec.yaml

          # Clean build
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # Build artifact ko runner directory me copy karo
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMitra-APK
          path: output/app-release.apk
