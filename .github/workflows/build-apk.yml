name: Build RideMitra APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Prepare and Build Flutter Project
        run: |
          # 1. Project directory setup
          mkdir -p workspace

          # 2. Base project skeleton generate karo
          cd workspace
          flutter create . --project-name ridemitra --overwrite

          # 3. AAPKI main.dart aur pubspec.yaml copy karo (overwrite default counter code)
          cd ..
          cp pubspec.yaml workspace/pubspec.yaml
          cp main.dart workspace/lib/main.dart

          cd workspace

          # 4. Kotlin settings script
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle")
          if p.exists():
              s = p.read_text()
              if "org.jetbrains.kotlin.android" not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id "org.jetbrains.kotlin.android" version "2.1.0" apply false',
                      1
                  )
              elif re.search(r'id\s+"org\.jetbrains\.kotlin\.android"\s+apply false', s):
                  s = re.sub(
                      r'id\s+"org\.jetbrains\.kotlin\.android"\s+apply false',
                      'id "org.jetbrains.kotlin.android" version "2.1.0" apply false',
                      s,
                      count=1
                  )
              p.write_text(s)
          PY

          # 5. Build APK
          flutter pub get
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMitra-APK
          path: workspace/build/app/outputs/flutter-apk/app-release.apk
